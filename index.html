<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Escala e Rodízio do Clã</title>
  <style>
    :root {
      --bg-color: #121826;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --whatsapp-color: #25d366;
      --whatsapp-hover: #1da851;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .grid-settings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #e2e8f0;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent-color);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-whatsapp {
      background: var(--whatsapp-color);
      color: white;
    }

    .btn-whatsapp:hover {
      background: var(--whatsapp-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .actions-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    /* Cards da Escala Semanal */
    .escala-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .dia-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dia-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .dia-header h3 {
      font-size: 1.05rem;
      color: #6366f1;
    }

    .dia-corpo {
      flex-grow: 1;
      margin-bottom: 15px;
    }

    .membro-item {
      font-size: 0.9rem;
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #334155;
    }

    .membro-item:last-child {
      border-bottom: none;
    }

    .tag-sistema {
      background: #312e81;
      color: #c7d2fe;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .hist-section {
      margin-top: 30px;
    }

    .hist-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hist-info h4 {
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .hist-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .actions-bar { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🛡️ Rodízio e Escala do Clã</h1>
      <p>Organize turnos, aplique regras de pontuação e envie mensagens formatadas por dia ou geral.</p>
    </header>

    <!-- Configurações e Membros -->
    <div class="grid-settings">
      <div class="card">
        <h2>⚙️ Configurações da Guilda</h2>
        <div class="form-group">
          <label for="nomeGuilda">Nome da Guilda / Clã</label>
          <input type="text" id="nomeGuilda" value="Os Imortais">
        </div>
        <div class="form-group">
          <label for="nomeLider">Nome do Líder</label>
          <input type="text" id="nomeLider" value="Líder Supremo">
        </div>
        <div class="form-group">
          <label for="pontuacaoMinima">Pontuação Mínima para Sistema</label>
          <input type="number" id="pontuacaoMinima" value="80">
        </div>
      </div>

      <div class="card">
        <h2>👥 Colar Lista de Jogadores</h2>
        <div class="form-group">
          <label for="membrosTexto">Cole os nomes (ex: "Jogador1 - 90" ou só "Jogador1")</label>
          <textarea id="membrosTexto" placeholder="Jogador1 - 95
Jogador2 - 82
Jogador3 - 70
Jogador4 - 88"></textarea>
        </div>
        <button class="btn btn-primary" onclick="processarEManterMembros()">Salvar / Atualizar Membros</button>
      </div>
    </div>

    <!-- Barra de Ações Principais -->
    <div class="actions-bar">
      <button class="btn btn-primary" onclick="gerarNovaEscala()">⚡ Gerar Nova Escala</button>
      <button class="btn btn-whatsapp" onclick="enviarWhatsAppLider()">📲 Enviar para Líder (Completo)</button>
      <button class="btn btn-whatsapp" onclick="enviarWhatsAppJogadores()">📲 Enviar para Jogadores (Premiação)</button>
      <button class="btn btn-danger" onclick="limparEscalaAtual()">🗑️ Limpar Escala Atual</button>
    </div>

    <!-- Visualização da Escala Gerada -->
    <h2 style="margin-bottom: 15px;">📅 Escala Atual da Semana</h2>
    <div id="escalaContainer" class="escala-grid">
      <!-- Cards dos dias renderizados via JavaScript -->
      <p style="color: var(--text-muted); grid-column: 1 / -1;">Nenhuma escala gerada no momento. Clique em "Gerar Nova Escala".</p>
    </div>

    <!-- Histórico de Escalas -->
    <div class="hist-section card">
      <h2>📜 Histórico de Escalas Salvas</h2>
      <div id="historicoContainer">
        <!-- Itens do histórico renderizados via JS -->
      </div>
    </div>
  </div>

  <script>
    // Sequência de turnos do sistema de rodízio
    const turnosOrdenados = [
      "Sáb Tarde",
      "Domingo",
      "Segunda",
      "Terça",
      "Quarta",
      "Quinta",
      "Sexta",
      "Sáb Manhã"
    ];

    let membrosLista = [];
    let escalaAtual = null;

    // Inicialização do Sistema
    window.onload = function() {
      carregarConfiguracoes();
      carregarMembrosSalvos();
      carregarEscalaAtualSalva();
      renderizarHistorico();
    };

    function carregarConfiguracoes() {
      const config = JSON.parse(localStorage.getItem('clan_config')) || {};
      if (config.nomeGuilda) document.getElementById('nomeGuilda').value = config.nomeGuilda;
      if (config.nomeLider) document.getElementById('nomeLider').value = config.nomeLider;
      if (config.pontuacaoMinima) document.getElementById('pontuacaoMinima').value = config.pontuacaoMinima;
    }

    function salvarConfiguracoes() {
      const config = {
        nomeGuilda: document.getElementById('nomeGuilda').value,
        nomeLider: document.getElementById('nomeLider').value,
        pontuacaoMinima: parseInt(document.getElementById('pontuacaoMinima').value) || 80
      };
      localStorage.setItem('clan_config', JSON.stringify(config));
      return config;
    }

    function processarEManterMembros() {
      const texto = document.getElementById('membrosTexto').value;
      const minPontos = parseInt(document.getElementById('pontuacaoMinima').value) || 80;
      const linhas = texto.split('\n');

      membrosLista = [];

      linhas.forEach(linha => {
        let l = linha.trim();
        if (!l) return;

        let partes = l.split('-');
        let nome = partes[0].trim();
        let pontos = partes[1] ? parseInt(partes[1].trim()) : 80;

        if (isNaN(pontos)) pontos = 80;

        membrosLista.push({
          nome: nome,
          pontos: pontos,
          isSistema: pontos >= minPontos
        });
      });

      localStorage.setItem('clan_membros', JSON.stringify(membrosLista));
      salvarConfiguracoes();
      alert(`${membrosLista.length} membros processados e salvos com sucesso!`);
    }

    function carregarMembrosSalvos() {
      const salvos = localStorage.getItem('clan_membros');
      if (salvos) {
        membrosLista = JSON.parse(salvos);
        document.getElementById('membrosTexto').value = membrosLista.map(m => `${m.nome} - ${m.pontos}`).join('\n');
      }
    }

    // Regra Principal de Geração de Escala
    function gerarNovaEscala() {
      const config = salvarConfiguracoes();

      if (membrosLista.length === 0) {
        alert("Por favor, adicione e salve a lista de membros antes de gerar a escala.");
        return;
      }

      // Separa membros do Sistema (>= 80 pts ou flag de Sistema) dos demais
      let sistemaMembros = membrosLista.filter(m => m.pontos >= config.pontuacaoMinima || m.isSistema);
      let outrosMembros = membrosLista.filter(m => !(m.pontos >= config.pontuacaoMinima || m.isSistema));

      // Embaralha para distribuir de forma justa
      sistemaMembros.sort(() => Math.random() - 0.5);
      outrosMembros.sort(() => Math.random() - 0.5);

      let escala = {};
      turnosOrdenados.forEach(t => escala[t] = []);

      // Regra: Sexta e Sáb Manhã priorizam membros do Sistema
      const diasPrioritariosSistema = ["Sexta", "Sáb Manhã"];

      // Aloca nos dias de prioridade
      diasPrioritariosSistema.forEach(dia => {
        let qtdParaAlocar = Math.max(1, Math.ceil(membrosLista.length / turnosOrdenados.length));
        for (let i = 0; i < qtdParaAlocar && sistemaMembros.length > 0; i++) {
          escala[dia].push(sistemaMembros.pop());
        }
      });

      // Sobras de membros do sistema combinados com os demais
      let poolGeral = [...sistemaMembros, ...outrosMembros];
      poolGeral.sort(() => Math.random() - 0.5);

      // Distribui o restante nos turnos disponíveis
      let turnoIndex = 0;
      while (poolGeral.length > 0) {
        let turnoNome = turnosOrdenados[turnoIndex % turnosOrdenados.length];
        escala[turnoNome].push(poolGeral.pop());
        turnoIndex++;
      }

      escalaAtual = escala;
      localStorage.setItem('escala_atual', JSON.stringify(escalaAtual));

      // Salvar no Histórico automaticamente
      salvarNoHistorico(escalaAtual);

      renderizarEscala(escalaAtual);
    }

    function renderizarEscala(escala) {
      const container = document.getElementById('escalaContainer');
      container.innerHTML = '';

      turnosOrdenados.forEach(dia => {
        const membros = escala[dia] || [];
        const cardDia = document.createElement('div');
        cardDia.classList.add('dia-card');

        let listaHTML = membros.map(m => `
          <div class="membro-item">
            <span>${m.nome}</span>
            ${m.pontos >= 80 ? '<span class="tag-sistema">Sistema</span>' : `<span style="color:#94a3b8; font-size:0.8rem">${m.pontos} pts</span>`}
          </div>
        `).join('');

        if (membros.length === 0) {
          listaHTML = `<p style="color:var(--text-muted); font-size:0.85rem;">Nenhum escalado</p>`;
        }

        // Botão de envio individual por dia restaurado aqui
        cardDia.innerHTML = `
          <div class="dia-header">
            <h3>${dia}</h3>
            <button class="btn btn-whatsapp" style="padding: 4px 8px; font-size: 0.75rem;" onclick="enviarEscalaDia('${dia}')">
              📲 Enviar ${dia}
            </button>
          </div>
          <div class="dia-corpo">
            ${listaHTML}
          </div>
        `;

        container.appendChild(cardDia);
      });
    }

    // Disparo individual por dia via WhatsApp
    function enviarEscalaDia(dia) {
      if (!escalaAtual || !escalaAtual[dia]) {
        alert("Nenhuma escala encontrada para este dia.");
        return;
      }

      const config = salvarConfiguracoes();
      const membros = escalaAtual[dia];
      const listaNomes = membros.map(m => `- ${m.nome}`).join('\n');

      const mensagem = `🛡️ *${config.nomeGuilda.toUpperCase()}* - *Escala ${dia.toUpperCase()}*\n👑 *Líder:* ${config.nomeLider}\n\n*Integrantes Escalados:*\n${listaNomes}\n\nGood Game e boa sorte a todos! ⚔️`;

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    }

    // Disparo Geral - Envio do Líder (Mensagem completa com contagem)
    function enviarWhatsAppLider() {
      if (!escalaAtual) return alert("Gere uma escala primeiro.");
      const config = salvarConfiguracoes();

      let textoTurnos = '';
      let totalGeral = 0;

      turnosOrdenados.forEach(dia => {
        let qtd = escalaAtual[dia].length;
        totalGeral += qtd;
        let nomes = escalaAtual[dia].map(m => m.nome).join(', ');
        textoTurnos += `\n*${dia}* (${qtd}): ${nomes || 'Nenhum'}`;
      });

      const msg = `👑 *[RELATÓRIO DO LÍDER]* - ${config.nomeGuilda}\n👑 *Líder:* ${config.nomeLider}\n📊 *Total Participantes:* ${totalGeral}\n${textoTurnos}\n\n📌 Escala salva e verificada pelo sistema.`;

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Disparo Geral - Envio dos Jogadores (Premiação/Resumo)
    function enviarWhatsAppJogadores() {
      if (!escalaAtual) return alert("Gere uma escala primeiro.");
      const config = salvarConfiguracoes();

      let textoTurnos = '';
      turnosOrdenados.forEach(dia => {
        let nomes = escalaAtual[dia].map(m => m.nome).join('\n  - ');
        textoTurnos += `\n📅 *${dia}*\n  - ${nomes || 'Nenhum'}\n`;
      });

      const msg = `⚔️ *RODÍZIO SEMANAL* - ${config.nomeGuilda} ⚔️\n\nConfiram a escala de presença e premiações da semana:\n${textoTurnos}\n🎁 Cumpram seus turnos para garantir a pontuação mínima de ${config.pontuacaoMinima} pontos!`;

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Persistência do Histórico
    function salvarNoHistorico(escala) {
      const historico = JSON.parse(localStorage.getItem('historico_escalas')) || [];
      const config = salvarConfiguracoes();

      const item = {
        id: Date.now(),
        data: new Date().toLocaleString('pt-BR'),
        guilda: config.nomeGuilda,
        lider: config.nomeLider,
        escala: escala
      };

      historico.unshift(item); // Adiciona no início
      localStorage.setItem('historico_escalas', JSON.stringify(historico));
      renderizarHistorico();
    }

    function renderizarHistorico() {
      const container = document.getElementById('historicoContainer');
      const historico = JSON.parse(localStorage.getItem('historico_escalas')) || [];

      if (historico.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.85rem;">Nenhum histórico armazenado ainda.</p>`;
        return;
      }

      container.innerHTML = historico.map(h => `
        <div class="hist-card">
          <div class="hist-info">
            <h4>🛡️ ${h.guilda} - ${h.data}</h4>
            <p>Líder: ${h.lider}</p>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-primary" style="padding:6px 10px; font-size:0.8rem;" onclick="carregarHistorico(${h.id})">Restaurar Tela</button>
            <button class="btn btn-danger" style="padding:6px 10px; font-size:0.8rem;" onclick="excluirHistorico(${h.id})">Deletar</button>
          </div>
        </div>
      `).join('');
    }

    function carregarHistorico(id) {
      const historico = JSON.parse(localStorage.getItem('historico_escalas')) || [];
      const encontrado = historico.find(item => item.id === id);

      if (encontrado) {
        escalaAtual = encontrado.escala;
        localStorage.setItem('escala_atual', JSON.stringify(escalaAtual));
        renderizarEscala(escalaAtual);
        window.scrollTo({ top: 300, behavior: 'smooth' });
      }
    }

    function excluirHistorico(id) {
      let historico = JSON.parse(localStorage.getItem('historico_escalas')) || [];
      historico = historico.filter(item => item.id !== id);
      localStorage.setItem('historico_escalas', JSON.stringify(historico));
      renderizarHistorico();
    }

    function carregarEscalaAtualSalva() {
      const escalaSalva = localStorage.getItem('escala_atual');
      if (escalaSalva) {
        escalaAtual = JSON.parse(escalaSalva);
        renderizarEscala(escalaAtual);
      }
    }

    function limparEscalaAtual() {
      if (confirm("Deseja realmente limpar a escala atual da tela? (O histórico antigo continuará salvo)")) {
        escalaAtual = null;
        localStorage.removeItem('escala_atual');
        document.getElementById('escalaContainer').innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1;">Nenhuma escala gerada no momento. Clique em "Gerar Nova Escala".</p>`;
      }
    }
  </script>
</body>
</html>
